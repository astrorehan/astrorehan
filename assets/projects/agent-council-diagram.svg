<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="agent-council - four adversarial roles, one falsifiable ruling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="55%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FB950" stop-opacity="0"/>
      <stop offset="18%" stop-color="#3FB950" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#F85149" stop-opacity="0.9"/>
      <stop offset="66%" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="88%" stop-color="#D29922" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D29922" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="18" fill="none" stroke="#232A36" stroke-width="1"/>

  <g opacity="0.5">
    <path d="M0 0 L1280 420" stroke="#1B2230" stroke-width="1"/>
    <path d="M1280 0 L0 420" stroke="#1B2230" stroke-width="1"/>
  </g>

  <rect x="164" y="86" width="952" height="2" fill="url(#rule)"/>

  <text x="640" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="7" fill="#6E7681">A G E N T &#160; S K I L L</text>

  <text x="640" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="86" font-weight="700" letter-spacing="-2" fill="#E6EDF3">agent-council</text>

  <text x="640" y="274" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#8B949E">Four adversarial roles. One falsifiable ruling.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.5">
    <g>
      <rect x="164" y="322" width="220" height="54" rx="10" fill="#111A14" stroke="#23402A"/>
      <circle cx="192" cy="349" r="5.5" fill="#3FB950"/>
      <text x="214" y="355" fill="#7EE787">BELIEVER</text>
    </g>
    <g>
      <rect x="408" y="322" width="220" height="54" rx="10" fill="#1A1113" stroke="#452327"/>
      <circle cx="436" cy="349" r="5.5" fill="#F85149"/>
      <text x="458" y="355" fill="#FF8A80">SKEPTIC</text>
    </g>
    <g>
      <rect x="652" y="322" width="220" height="54" rx="10" fill="#0E1622" stroke="#1F3A5C"/>
      <circle cx="680" cy="349" r="5.5" fill="#58A6FF"/>
      <text x="702" y="355" fill="#8FC7FF">INVESTOR</text>
    </g>
    <g>
      <rect x="896" y="322" width="220" height="54" rx="10" fill="#1A1608" stroke="#453A17"/>
      <circle cx="924" cy="349" r="5.5" fill="#D29922"/>
      <text x="946" y="355" fill="#E3B341">JUDGE</text>
    </g>
  </g>

  <g transform="translate(1078 92) rotate(-7)" opacity="0.92">
    <rect x="-84" y="-30" width="168" height="60" rx="8" fill="none" stroke="#F85149" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="0" y="-4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" letter-spacing="1" fill="#F85149">50% SURE</text>
    <text x="0" y="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#B4494A">SELF-RULED</text>
  </g>
</svg>
